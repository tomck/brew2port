[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "brew2port"
version = "0.3.1"
description = "Safe Homebrew to MacPorts migration planner"
requires-python = ">=3.9"
dependencies = ["macpkg-migrate-core>=0.3,<0.4"]
[project.scripts]
brew2port = "brew2port.cli:main"

[tool.setuptools.packages.find]
include = ["brew2port*"]
